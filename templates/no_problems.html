{% extends 'base.html' %}

{% block content %}
<div style="text-align:center; padding:60px 20px;">
    <div style="font-size:48px; margin-bottom:18px;">&#129514;</div>
    <h2 style="color:var(--cyber-teal); margin:0 0 12px 0;">No Reaction Sets Loaded</h2>
    <p style="color:var(--text-muted); font-size:14px; max-width:480px; margin:0 auto 28px auto; line-height:1.7;">
        The assessment database contains no stoichiometry problems yet.
        Ask your instructor to populate the problem bank, or run the seeding command:
    </p>
    <code style="display:inline-block; background:#0F1115; border:1px solid #2A303C;
                 color:var(--constant-gold); padding:10px 18px; border-radius:5px; font-size:13px;">
        python manage.py seed_problems
    </code>
    <div style="margin-top:32px;">
        <a href="{% url 'problem_lobby' %}"
           style="color:var(--cyber-teal); text-decoration:none; border:1px solid var(--cyber-teal);
                  padding:9px 22px; border-radius:4px; font-weight:bold; font-size:13px;">
            &#8592; Back to Lobby
        </a>
    </div>
</div>
{% endblock content %}
